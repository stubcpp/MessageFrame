name: C++ CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }} - ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++
            cc: gcc
            cxx: g++
          - os: macos-latest
            compiler: clang++
            cc: clang
            cxx: clang++

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4.2.2
      with:
        submodules: recursive

    - name: Set up Build Environment
      run: |
        echo "CC=${{ matrix.cc }}" >> $GITHUB_ENV
        echo "CXX=${{ matrix.cxx }}" >> $GITHUB_ENV

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DMSGFRAME_BUILD_EXAMPLES=ON \
          -DMSGFRAME_BUILD_TESTS=ON \
          -DMSGFRAME_BUILD_BENCHMARKS=ON

    - name: Build Everything (Verbose Log)
      # Додали VERBOSE=1, щоб Clang виплюнув у термінл точний текст помилки
      run: cmake --build build --config Release --parallel 4 -- VERBOSE=1

    - name: Run Unit Tests
      run: |
        cd build
        ctest --output-on-failure -C Release
